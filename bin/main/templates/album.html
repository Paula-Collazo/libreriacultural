<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${album != null ? album.title + ' - Libreria Cultural' : 'Disco - Libreria Cultural'}">Disco - Libreria Cultural</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
    <div class="grain"></div>

    <header class="topbar">
        <a class="brand" href="/profile" th:text="${'@' + user.username}">@usuario</a>
        <div class="topbar-actions">
            <div class="theme-switch">
                <label for="themePicker">Tema</label>
                <select id="themePicker" data-theme-select>
                    <option value="rosa">Rosa Pastel</option>
                    <option value="azul">Azul Pastel</option>
                    <option value="menta">Menta Pastel</option>
                    <option value="durazno">Durazno Pastel</option>
                </select>
            </div>
            <a class="ghost-link" href="/profile">Mi perfil</a>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="ghost-btn">Cerrar sesion</button>
            </form>
        </div>
    </header>

    <main class="album-wrap">
        <section class="type-nav card compact-nav">
            <a th:href="@{/profile}" th:classappend="${activeType == 'profile'} ? ' active' : ''">Mi perfil</a>
            <a th:href="@{/explore/pelicula}" th:classappend="${activeType == 'pelicula'} ? ' active' : ''">Peliculas</a>
            <a th:href="@{/explore/serie}" th:classappend="${activeType == 'serie'} ? ' active' : ''">Series</a>
            <a th:href="@{/explore/libro}" th:classappend="${activeType == 'libro'} ? ' active' : ''">Libros</a>
            <a th:href="@{/explore/disco}" th:classappend="${activeType == 'disco'} ? ' active' : ''">Discos</a>
        </section>

        <section class="card" th:if="${errorMessage != null}">
            <p class="error" th:text="${errorMessage}"></p>
        </section>

        <section class="card album-hero" th:if="${album != null}">
            <div class="media-cover" th:if="${album.coverUrl != null and !album.coverUrl.isBlank()}">
                <img th:src="${album.coverUrl}" th:alt="${'Portada de ' + album.title}">
            </div>
            <div class="media-cover placeholder" th:if="${album.coverUrl == null or album.coverUrl.isBlank()}">
                <span>Sin portada</span>
            </div>

            <div>
                <p class="kicker">Disco</p>
                <h1 th:text="${album.title}">Album</h1>
                <p class="muted" th:if="${album.artistName != null and !#strings.isEmpty(album.artistName)}">
                    Artista:
                    <a class="artist-link" th:href="@{/explore/disco(artistId=${album.artistId})}" th:text="${album.artistName}">Artista</a>
                </p>
                <p class="muted" th:if="${album.metricLabel != null and !album.metricLabel.isBlank()}"
                   th:text="${album.metricLabel}">Canciones</p>
                <p class="muted" th:if="${album.releaseDate != null}"
                   th:text="${'Año de salida: ' + album.releaseDate.year}">Año</p>
                <p class="muted" th:if="${!#strings.isEmpty(album.description)}" th:text="${album.description}">Descripcion</p>

                <form method="post" th:action="@{/profile/import-api}" class="add-form">
                    <input type="hidden" name="externalTitle" th:value="${album.title}">
                    <input type="hidden" name="externalType" th:value="${album.type}">
                    <input type="hidden" name="externalDescription" th:value="${album.description}">
                    <input type="hidden" name="externalReleaseDate" th:value="${album.releaseDate}">
                    <input type="hidden" name="externalMetric" th:value="${album.metricLabel}">
                    <input type="hidden" name="returnTo" th:value="${'/explore/disco/' + album.externalId}">
                    <button type="submit">Anadir a mi perfil</button>
                </form>
            </div>
        </section>

        <section class="card" th:if="${album != null}">
            <h2>Tracklist</h2>
            <ol class="track-list">
                <li class="track-row" th:each="track : ${tracks}">
                    <span th:text="${track.trackNumber != null ? track.trackNumber : '-'}">1</span>
                    <strong th:text="${track.title}">Tema</strong>
                    <span th:text="${track.durationLabel}">3:25</span>
                </li>
                <li class="track-row" th:if="${#lists.isEmpty(tracks)}">
                    <span>-</span>
                    <strong>No hay canciones disponibles</strong>
                    <span></span>
                </li>
            </ol>
        </section>

        <section class="card" th:if="${!#lists.isEmpty(otherAlbums)}">
            <div class="media-header media-disc-head">
                <h2>Otros discos</h2>
                <span class="count-pill" th:text="${#lists.size(otherAlbums) + ' items'}">0 items</span>
            </div>
            <div class="content-grid">
                <article class="media-card" th:each="item : ${otherAlbums}">
                    <div class="media-cover" th:if="${item.coverUrl != null and !item.coverUrl.isBlank()}">
                        <img th:src="${item.coverUrl}" th:alt="${'Portada de ' + item.title}">
                    </div>
                    <div class="media-cover placeholder" th:if="${item.coverUrl == null or item.coverUrl.isBlank()}">
                        <span>Sin portada</span>
                    </div>
                    <div class="media-body">
                        <h3 th:text="${item.title}">Titulo</h3>
                        <p class="muted" th:text="${item.source}">Fuente</p>
                        <p class="muted" th:if="${item.artistName != null and !#strings.isEmpty(item.artistName)}">
                            Artista:
                            <a class="artist-link" th:href="@{/explore/disco(artistId=${item.artistId})}" th:text="${item.artistName}">Artista</a>
                        </p>
                        <p class="media-metric" th:if="${item.metricLabel != null and !item.metricLabel.isBlank()}"
                           th:text="${item.metricLabel}">Canciones</p>
                        <p class="muted" th:if="${item.releaseDate != null}" th:text="${'Año de salida: ' + item.releaseDate.year}">Año</p>
                    </div>
                    <div class="media-actions">
                        <a class="mini-link" th:href="@{/explore/disco/{id}(id=${item.externalId})}">Ver canciones</a>
                        <form method="post" th:action="@{/profile/import-api}">
                            <input type="hidden" name="externalTitle" th:value="${item.title}">
                            <input type="hidden" name="externalType" th:value="${item.type}">
                            <input type="hidden" name="externalDescription" th:value="${item.description}">
                            <input type="hidden" name="externalReleaseDate" th:value="${item.releaseDate}">
                            <input type="hidden" name="externalMetric" th:value="${item.metricLabel}">
                            <input type="hidden" name="returnTo" th:value="${'/explore/disco/' + item.externalId}">
                            <button type="submit">Anadir a mi perfil</button>
                        </form>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <script defer th:src="@{/js/theme.js}"></script>
</body>
</html>
