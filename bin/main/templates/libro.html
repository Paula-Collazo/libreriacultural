<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${movie != null ? movie.title + ' - Libreria Cultural' : 'Libro - Libreria Cultural'}">Libro - Libreria Cultural</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
    <div class="grain"></div>

    <header class="topbar">
        <a class="brand" href="/profile" th:text="${'@' + user.username}">@usuario</a>
        <div class="topbar-actions">
            <div class="theme-switch">
                <label for="themePicker">Tema</label>
                <select id="themePicker" data-theme-select>
                    <option value="rosa">Rosa Pastel</option>
                    <option value="azul">Azul Pastel</option>
                    <option value="menta">Menta Pastel</option>
                    <option value="durazno">Durazno Pastel</option>
                </select>
            </div>
            <a class="ghost-link" href="/profile">Mi perfil</a>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="ghost-btn">Cerrar sesion</button>
            </form>
        </div>
    </header>

    <main class="album-wrap">
        <section class="type-nav card compact-nav">
            <a th:href="@{/profile}" th:classappend="${activeType == 'profile'} ? ' active' : ''">Mi perfil</a>
            <a th:href="@{/explore/pelicula}" th:classappend="${activeType == 'pelicula'} ? ' active' : ''">Peliculas</a>
            <a th:href="@{/explore/serie}" th:classappend="${activeType == 'serie'} ? ' active' : ''">Series</a>
            <a th:href="@{/explore/libro}" th:classappend="${activeType == 'libro'} ? ' active' : ''">Libros</a>
            <a th:href="@{/explore/disco}" th:classappend="${activeType == 'disco'} ? ' active' : ''">Discos</a>
        </section>

        <section class="card" th:if="${errorMessage != null}">
            <p class="error" th:text="${errorMessage}"></p>
        </section>

        <section class="card album-hero" th:if="${movie != null}">
            <div class="media-cover" th:if="${movie.coverUrl != null and !movie.coverUrl.isBlank()}">
                <img th:src="${movie.coverUrl}" th:alt="${'Portada de ' + movie.title}">
            </div>
            <div class="media-cover placeholder" th:if="${movie.coverUrl == null or movie.coverUrl.isBlank()}">
                <span>Sin portada</span>
            </div>

            <div>
                <p class="kicker">Libro</p>
                <h1 th:text="${movie.title}">Libro</h1>
                
                <p class="muted" th:if="${movie.releaseDate != null}" th:text="${'Año de salida: ' + movie.releaseDate.year}">Año</p>
                <p class="muted" th:if="${movie.description != null and !#strings.isEmpty(movie.description)}" th:text="${movie.description}">Descripcion</p>

                <form method="post" th:action="@{/profile/import-api}" class="add-form">
                    <input type="hidden" name="externalTitle" th:value="${movie.title}">
                    <input type="hidden" name="externalType" th:value="${movie.type}">
                    <input type="hidden" name="externalDescription" th:value="${movie.description}">
                    <input type="hidden" name="externalReleaseDate" th:value="${movie.releaseDate}">
                    <input type="hidden" name="externalMetric" th:value="${movie.metricLabel}">
                    <!-- Note for OpenLibrary the id starts with /works/, we have to encode it or pass it safely. Since it's passed as path var, we just pass the ID part -->
                    <input type="hidden" name="returnTo" th:value="${'/explore/libro/' + #strings.replace(movie.externalId, '/works/', '')}">
                    <button type="submit">Anadir a mi perfil</button>
                </form>
            </div>
        </section>

    </main>

    <script defer th:src="@{/js/theme.js}"></script>
</body>
</html>
