<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${actor['name'] + ' - Libreria Cultural'}">Actor - Libreria Cultural</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/music.css}">
    <style>
        .actor-hero {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2.5rem;
            align-items: start;
            margin-bottom: 3rem;
        }
        .actor-photo {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .actor-photo img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        .actor-photo:hover img {
            transform: scale(1.05);
        }
        .bio-text {
            font-size: 1.15rem;
            line-height: 1.7;
            color: var(--text);
            opacity: 0.9;
            white-space: pre-line; /* Mantiene los saltos de linea de la bio */
        }
        .filmography-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        @media (max-width: 850px) {
            .actor-hero {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .actor-photo {
                max-width: 250px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="grain"></div>

    <header class="topbar">
        <a class="brand" th:href="${user != null ? '/profile' : '/'}" th:text="${user != null ? '@' + user.username : 'The Cultured Dept.'}">@usuario</a>
        <div class="topbar-actions" style="display:flex; align-items:center; gap:1rem;">
            <button class="ghost-btn" style="padding:0.4rem; min-height:unset; font-size:1rem;" data-mode-toggle aria-label="Cambiar modo">☀</button>
            <a class="ghost-link" href="/profile" th:if="${user != null}">Mi perfil</a>
            <form method="post" th:action="@{/logout}" th:if="${user != null}" style="margin:0;">
                <button type="submit" class="ghost-btn">Cerrar sesion</button>
            </form>
            <a class="ghost-link" href="/" th:if="${user == null}">Iniciar sesión</a>
            <a class="ghost-btn" href="/register" th:if="${user == null}">Regístrate</a>
        </div>
    </header>

    <main class="album-wrap">
        <section class="type-nav card compact-nav">
            <a th:href="@{/profile}">Mi perfil</a>
            <a th:href="@{/explore/pelicula}" th:classappend="${activeType == 'pelicula'} ? ' active' : ''">Peliculas</a>
            <a th:href="@{/explore/serie}" th:classappend="${activeType == 'serie'} ? ' active' : ''">Series</a>
            <a th:href="@{/explore/libro}">Libros</a>
            <a th:href="@{/explore/disco}">Discos</a>
        </section>

        <!-- Perfil del Actor -->
        <section class="card">
            <div class="actor-hero">
                <div class="actor-photo">
                    <img th:if="${actor['photoUrl'] != null and !#strings.isEmpty(actor['photoUrl'])}" 
                         th:src="${actor['photoUrl']}" th:alt="${actor['name']}">
                    <div th:if="${actor['photoUrl'] == null or #strings.isEmpty(actor['photoUrl'])}" 
                         class="media-cover placeholder"><span>Sin foto</span></div>
                </div>
                <div class="actor-info">
                    <p class="kicker">Perfil de Artista</p>
                    <h1 th:text="${actor['name']}" style="font-size: 3rem; margin-bottom: 1.5rem;">Nombre</h1>
                    <div class="bio-text" th:text="${actor['bio']}">Biografía no disponible.</div>
                </div>
            </div>
        </section>

        <!-- Filmografía -->
        <section class="card" th:if="${actor['movies'] != null and !#lists.isEmpty(actor['movies'])}">
            <h2 style="font-size: 2rem;">Filmografía Destacada</h2>
            <div class="filmography-grid">
                <div class="actor-card" th:each="m : ${actor['movies']}">
                    <!-- Enlace manual seguro como en las otras fichas -->
                    <a th:href="|/explore/${m['type']}/${m['externalId']}|">
                        <div class="media-cover">
                            <img th:src="${m['coverUrl']}" th:alt="${m['title']}">
                        </div>
                        <p class="small-title" th:text="${m['title']}">Título</p>
                    </a>
                </div>
            </div>
        </section>

        <section class="card" style="text-align: center;">
            <a href="javascript:history.back()" class="artist-link" style="font-size: 1.2rem;">← Volver atrás</a>
        </section>
    </main>

    <script defer th:src="@{/js/theme.js}"></script>
</body>
</html>
