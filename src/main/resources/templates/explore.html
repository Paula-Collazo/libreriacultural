<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'Explorar ' + typeLabel + ' - Libreria Cultural'}">Explorar - Libreria Cultural</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
    <div class="grain"></div>

    <header class="topbar">
        <a class="brand" href="/profile" th:text="${'@' + user.username}">@usuario</a>
        <div class="topbar-actions">
            <div class="theme-switch">
                <label for="themePicker">Tema</label>
                <select id="themePicker" data-theme-select>
                    <option value="rosa">Rosa Pastel</option>
                    <option value="azul">Azul Pastel</option>
                    <option value="menta">Menta Pastel</option>
                    <option value="durazno">Durazno Pastel</option>
                </select>
            </div>
            <a class="ghost-link" href="/profile">Mi perfil</a>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="ghost-btn">Cerrar sesion</button>
            </form>
        </div>
    </header>

    <main class="explore-wrap">
        <section class="type-nav card compact-nav">
            <a th:href="@{/profile}" th:classappend="${activeType == 'profile'} ? ' active' : ''">Mi perfil</a>
            <a th:href="@{/explore/pelicula}" th:classappend="${activeType == 'pelicula'} ? ' active' : ''">Peliculas</a>
            <a th:href="@{/explore/serie}" th:classappend="${activeType == 'serie'} ? ' active' : ''">Series</a>
            <a th:href="@{/explore/libro}" th:classappend="${activeType == 'libro'} ? ' active' : ''">Libros</a>
            <a th:href="@{/explore/disco}" th:classappend="${activeType == 'disco'} ? ' active' : ''">Discos</a>
        </section>

        <section class="card explore-head">
            <h1 th:text="${artistFilter != null ? 'Discos de ' + artistFilter : typeLabel}">Peliculas</h1>
            <p class="muted">Busca por titulo y anade directamente a tu perfil.</p>

            <form method="get" th:action="@{/explore/{type}(type=${activeType})}" class="api-search-form">
                <label for="q">Buscar</label>
                <input id="q" name="q" type="text" th:value="${searchQuery}" placeholder="Ejemplo: Interstellar, Dark, Sapiens, Beatles" required>
                <button type="submit">Buscar</button>
            </form>
        </section>

        <section class="flash card" th:if="${successMessage != null}">
            <p class="ok" th:text="${successMessage}"></p>
        </section>
        <section class="flash card" th:if="${errorMessage != null}">
            <p class="error" th:text="${errorMessage}"></p>
        </section>
        <section class="flash card" th:if="${apiErrorMessage != null}">
            <p class="error" th:text="${apiErrorMessage}"></p>
        </section>

        <section class="content-grid" th:if="${!#lists.isEmpty(apiResults)}">
            <article class="media-card" th:each="item : ${apiResults}">
                <div class="media-cover" th:if="${item.coverUrl != null and !item.coverUrl.isBlank()}">
                    <img th:src="${item.coverUrl}" th:alt="${'Portada de ' + item.title}">
                </div>
                <div class="media-cover placeholder" th:if="${item.coverUrl == null or item.coverUrl.isBlank()}">
                    <span>Sin portada</span>
                </div>

                <div class="media-body">
                    <h3 th:text="${item.title}">Titulo</h3>
                    <p class="muted" th:if="${activeType != 'pelicula'}" th:text="${item.source}">Fuente</p>
                    <p class="muted" th:if="${activeType == 'pelicula' and item.directorName != null and !#strings.isEmpty(item.directorName)}">
                        Director:
                        <a class="artist-link" target="_blank" rel="noopener"
                           th:href="${'https://es.wikipedia.org/wiki/Special:Search?search=' + #strings.replace(item.directorName, ' ', '+')}"
                           th:text="${item.directorName}">Director</a>
                    </p>
                    <p class="muted" th:if="${activeType == 'disco' and item.artistName != null and !#strings.isEmpty(item.artistName)}">
                        Artista:
                        <a class="artist-link" th:href="@{/explore/disco(artistId=${item.artistId})}" th:text="${item.artistName}">Artista</a>
                    </p>
                    <p class="media-metric" th:if="${item.metricLabel != null and !item.metricLabel.isBlank()}"
                       th:text="${item.metricLabel}">Metric</p>
                    <p class="muted" th:if="${activeType != 'pelicula' and item.releaseDate != null}" th:text="${'Lanzamiento: ' + item.releaseDate}">Fecha</p>
                    <p class="muted" th:if="${activeType != 'disco' and activeType != 'pelicula' and !#strings.isEmpty(item.description)}" th:text="${item.description}">Descripcion</p>
                </div>

                <div class="media-actions">
                    <a class="mini-link" th:if="${activeType == 'disco'}" th:href="@{/explore/disco/{id}(id=${item.externalId})}">Ver canciones</a>
                    <a class="mini-link" th:if="${activeType == 'pelicula'}" th:href="@{/explore/pelicula/{id}(id=${item.externalId})}">Ver ficha</a>

                    <form method="post" th:action="@{/profile/import-api}">
                        <input type="hidden" name="externalTitle" th:value="${item.title}">
                        <input type="hidden" name="externalType" th:value="${item.type}">
                        <input type="hidden" name="externalDescription" th:value="${item.description}">
                        <input type="hidden" name="externalReleaseDate" th:value="${item.releaseDate}">
                        <input type="hidden" name="externalMetric" th:value="${item.metricLabel}">
                        <input type="hidden" name="returnTo" th:value="${'/explore/' + activeType}">
                        <button type="submit">Anadir a mi perfil</button>
                    </form>
                </div>
            </article>
        </section>

        <section class="card" th:if="${#lists.isEmpty(apiResults)}">
            <p class="muted">No encontramos resultados para esa busqueda.</p>
        </section>
    </main>

    <script defer th:src="@{/js/theme.js}"></script>
</body>
</html>
