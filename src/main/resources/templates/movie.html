<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle - Libreria Cultural</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/music.css}">
</head>
<body>
    <div class="grain"></div>

    <header class="topbar">
        <a class="brand" th:href="${user != null ? '/profile' : '/'}" style="display:flex; align-items:center; gap:0.5rem;">
            <img th:src="@{/img/logo.png}" alt="TCD Logo" style="height: 24px;">
            <span th:text="${user != null ? '@' + user.username : 'The Cultured Dept.'}"></span>
        </a>
        <div class="topbar-actions" style="display:flex; align-items:center; gap:1rem;">
            <button class="ghost-btn" style="padding:0.4rem; min-height:unset; font-size:1rem;" data-mode-toggle aria-label="Cambiar modo">☀</button>
            <a class="ghost-link" href="/profile" th:if="${user != null}">Mi perfil</a>
            <form method="post" th:action="@{/logout}" th:if="${user != null}" style="margin:0;">
                <button type="submit" class="ghost-btn">Cerrar sesion</button>
            </form>
            <a class="ghost-link" href="/" th:if="${user == null}">Iniciar sesión</a>
            <a class="ghost-btn" href="/register" th:if="${user == null}">Regístrate</a>
        </div>
    </header>

    <main class="album-wrap">
        <section class="type-nav card compact-nav">
            <a th:href="@{/profile}">Mi perfil</a>
            <a th:href="@{/explore/pelicula}" th:classappend="${activeType == 'pelicula'} ? ' active' : ''">Peliculas</a>
            <a th:href="@{/explore/serie}" th:classappend="${activeType == 'serie'} ? ' active' : ''">Series</a>
            <a th:href="@{/explore/libro}">Libros</a>
            <a th:href="@{/explore/disco}">Discos</a>
        </section>

        <!-- Bloque Principal -->
        <section class="card album-hero" th:if="${movie != null}">
            <div class="media-cover">
                <img th:if="${movie['coverUrl'] != null and !#strings.isEmpty(movie['coverUrl'])}" th:src="${movie['coverUrl']}" th:alt="${movie['title']}">
                <div th:if="${movie['coverUrl'] == null or #strings.isEmpty(movie['coverUrl'])}" class="media-cover placeholder"><span>?</span></div>
            </div>
            <div>
                <p class="kicker" th:text="${movie['type'] == 'serie' ? 'Serie' : 'Pelicula'}">Contenido</p>
                <h1 th:text="${movie['title'] != null ? movie['title'] : 'Sin titulo'}" style="margin-bottom: 0.2rem;">Titulo</h1>
                <p class="muted" th:if="${movie['tagline'] != null and !#strings.isEmpty(movie['tagline'])}" 
                   style="font-style: italic; font-size: 1.2rem; margin-bottom: 1.5rem; opacity: 0.8;" 
                   th:text="${'«' + movie['tagline'] + '»'}">Lema de la pelicula</p>
                
                <p class="muted" th:if="${movie['releaseDate'] != null and !#strings.isEmpty(movie['releaseDate'])}">
                    Lanzamiento: <span th:text="${movie['releaseDate']}">2024</span>
                </p>
                
                <!-- Enlace manual al director para evitar el error de SpringHrefTagProcessor -->
                <p class="muted" th:if="${movie['directorName'] != null and !#strings.isEmpty(movie['directorName'])}">
                    Director: <a class="artist-link" th:href="|/explore/actor/${movie['directorName']}|" th:text="${movie['directorName']}">Director</a>
                </p>
                
                <form method="post" th:action="@{/profile/import-api}" class="add-form" th:if="${movie['title'] != null}">
                    <input type="hidden" name="externalTitle" th:value="${movie['title']}">
                    <input type="hidden" name="externalType" th:value="${movie['type']}">
                    <input type="hidden" name="externalCoverUrl" th:value="${movie['coverUrl']}">
                    <input type="hidden" name="externalDescription" th:value="${movie['description']}">
                    <input type="hidden" name="externalReleaseDate" th:value="${movie['releaseDate'] != null ? movie['releaseDate'].toString() : ''}">
                    <button type="submit">Añadir a mi perfil</button>
                </form>
            </div>
        </section>

        <!-- Resumen Vitaminado -->
        <section class="card" th:if="${movie != null and movie['description'] != null and !#strings.isEmpty(movie['description'])}">
            <h2 style="font-size: 1.8rem; margin-bottom: 1rem;">Resumen de la trama</h2>
            <p class="muted" style="line-height: 1.8; font-size: 1.25rem; color: var(--text); opacity: 0.9;" 
               th:text="${movie['description']}">Descripcion larga.</p>
        </section>

        <!-- Reparto con enlaces manuales -->
        <section class="card" th:if="${actors != null and !#lists.isEmpty(actors)}">
            <h2>Reparto</h2>
            <div class="actor-grid">
                <div class="actor-card" th:each="actor : ${actors}">
                    <a th:if="${actor['name'] != null and !#strings.isEmpty(actor['name'])}" th:href="|/explore/actor/${actor['name']}|">
                        <div class="media-cover mini-cover">
                            <img th:if="${actor['photoUrl'] != null and !#strings.isEmpty(actor['photoUrl'])}" th:src="${actor['photoUrl']}" th:alt="${actor['name']}">
                            <div th:if="${actor['photoUrl'] == null or #strings.isEmpty(actor['photoUrl'])}" class="media-cover placeholder"><span>?</span></div>
                        </div>
                        <p class="small-title" th:text="${actor['name']}">Actor</p>
                    </a>
                </div>
            </div>
        </section>

        <!-- Recomendaciones -->
        <section class="card" th:if="${movie['recommendations'] != null and !#lists.isEmpty(movie['recommendations'])}">
            <h2 style="font-size: 1.8rem; margin-bottom: 1.5rem;">También te puede gustar</h2>
            <div class="actor-grid">
                <div class="actor-card" th:each="r : ${movie['recommendations']}">
                    <a th:href="|/explore/${r['type']}/${r['externalId']}|">
                        <div class="media-cover mini-cover">
                            <img th:src="${r['coverUrl']}" th:alt="${r['title']}">
                        </div>
                        <p class="small-title" th:text="${r['title']}">Título</p>
                    </a>
                </div>
            </div>
        </section>

        <section class="card">
            <a href="/profile" class="artist-link">Volver al perfil</a>
        </section>
    </main>

    <script defer th:src="@{/js/theme.js}"></script>
</body>
</html>
