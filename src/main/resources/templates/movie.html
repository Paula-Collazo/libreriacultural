<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle - Libreria Cultural</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>
<body>
    <div class="grain"></div>

    <header class="topbar">
        <a class="brand" href="/profile">@usuario</a>
        <div class="topbar-actions">
            <a class="ghost-link" href="/profile">Mi perfil</a>
        </div>
    </header>

    <main class="album-wrap">
        <!-- Contenido para Peliculas, Series y Libros -->
        <section class="card album-hero" th:if="${movie != null}">
            <div class="media-cover" th:if="${movie.coverUrl != null and !movie.coverUrl.isBlank()}">
                <img th:src="${movie.coverUrl}" th:alt="${movie.title}">
            </div>
            <div>
                <h1 th:text="${movie.title}">Titulo</h1>
                <p class="muted" th:text="${movie.description}">Descripcion</p>
                <p class="muted" th:if="${movie.releaseDate != null}" th:text="${'Lanzamiento: ' + movie.releaseDate}">Fecha</p>
                
                <form method="post" th:action="@{/profile/import-api}" class="add-form">
                    <input type="hidden" name="externalTitle" th:value="${movie.title}">
                    <input type="hidden" name="externalType" th:value="${movie.type}">
                    <input type="hidden" name="externalDescription" th:value="${movie.description}">
                    <input type="hidden" name="externalCoverUrl" th:value="${movie.coverUrl}">
                    <button type="submit">Añadir a mi perfil</button>
                </form>
            </div>
        </section>

        <!-- Contenido para Discos -->
        <section class="card album-hero" th:if="${album != null}">
            <div class="media-cover" th:if="${album.coverUrl != null and !album.coverUrl.isBlank()}">
                <img th:src="${album.coverUrl}" th:alt="${album.title}">
            </div>
            <div>
                <h1 th:text="${album.title}">Titulo</h1>
                <p class="muted" th:text="${'Artista: ' + album.artist}">Artista</p>
                
                <form method="post" th:action="@{/profile/import-api}" class="add-form">
                    <input type="hidden" name="externalTitle" th:value="${album.title}">
                    <input type="hidden" name="externalType" value="disco">
                    <input type="hidden" name="externalCoverUrl" th:value="${album.coverUrl}">
                    <button type="submit">Añadir a mi perfil</button>
                </form>
            </div>
        </section>
        
        <section class="card">
            <a href="/profile" class="artist-link">Volver al perfil</a>
        </section>
    </main>
</body>
</html>
