<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${(movie != null ? movie.title : 'Libro') + ' - Libreria Cultural'}">Libro</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/music.css}">
</head>
<body>
    <div class="grain"></div>

    <header class="topbar">
        <a class="brand" href="/profile" th:text="${user != null ? '@' + user.username : '@usuario'}">@usuario</a>
        <div class="topbar-actions">
            <div class="theme-switch">
                <label for="themePicker">Tema</label>
                <select id="themePicker" data-theme-select>
                    <option value="rosa">Rosa Pastel</option>
                    <option value="azul">Azul Pastel</option>
                    <option value="menta">Menta Pastel</option>
                    <option value="durazno">Durazno Pastel</option>
                </select>
            </div>
            <a class="ghost-link" href="/profile">Mi perfil</a>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="ghost-btn">Cerrar sesion</button>
            </form>
        </div>
    </header>

    <main class="album-wrap">
        <section class="type-nav card compact-nav">
            <a th:href="@{/profile}">Mi perfil</a>
            <a th:href="@{/explore/pelicula}">Peliculas</a>
            <a th:href="@{/explore/serie}">Series</a>
            <a th:href="@{/explore/libro}" class="active">Libros</a>
            <a th:href="@{/explore/disco}">Discos</a>
        </section>

        <!-- Detalle del Libro -->
        <section class="card album-hero" th:if="${movie != null}">
            <div class="media-cover" th:if="${movie.coverUrl != null and !#strings.isEmpty(movie.coverUrl)}">
                <img th:src="${movie.coverUrl}" th:alt="${movie.title}">
            </div>
            <div>
                <p class="kicker">Libro</p>
                <h1 th:text="${movie.title}">Titulo</h1>
                <p class="muted" th:if="${movie.author != null}">
                    Autor: <a class="artist-link" th:href="@{/explore/libro(q=${movie.author})}" th:text="${movie.author}">Autor</a>
                </p>
                <p class="muted" th:if="${movie.releaseDate != null}">
                    Lanzamiento: <span th:text="${movie.releaseDate}">2024</span>
                </p>
                <!-- Uso th:utext para interpretar etiquetas HTML como <p> o <br> que vienen de Google Books -->
                <div class="muted description-box" th:utext="${movie.description}">Descripcion</div>
                
                <form method="post" th:action="@{/profile/import-api}" class="add-form">
                    <input type="hidden" name="externalTitle" th:value="${movie.title}">
                    <input type="hidden" name="externalType" value="libro">
                    <input type="hidden" name="externalCoverUrl" th:value="${movie.coverUrl}">
                    <input type="hidden" name="externalDescription" th:value="${movie.description}">
                    <input type="hidden" name="externalReleaseDate" th:value="${movie.releaseDate != null ? movie.releaseDate.toString() : ''}">
                    <button type="submit">Añadir a mi perfil</button>
                </form>
            </div>
        </section>

        <!-- Libros Relacionados -->
        <section class="card" th:if="${relatedBooks != null and !#lists.isEmpty(relatedBooks)}">
            <h2 th:text="${'Mas de ' + movie.author}">Mas del autor</h2>
            <div class="actor-grid">
                <div class="actor-card" th:each="rel : ${relatedBooks}">
                    <a th:href="@{/explore/libro/{id}(id=${rel.externalId})}">
                        <div class="media-cover mini-cover">
                            <img th:if="${rel.coverUrl != null and !#strings.isEmpty(rel.coverUrl)}" th:src="${rel.coverUrl}" th:alt="${rel.title}">
                            <div th:if="${rel.coverUrl == null or #strings.isEmpty(rel.coverUrl)}" class="media-cover placeholder"><span>?</span></div>
                        </div>
                        <p class="small-title" th:text="${rel.title}">Titulo</p>
                    </a>
                </div>
            </div>
        </section>

        <section class="card">
            <a href="/profile" class="artist-link">Volver al perfil</a>
        </section>
    </main>

    <script defer th:src="@{/js/theme.js}"></script>
</body>
</html>
