<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${(album != null ? album.title : 'Disco') + ' - Libreria Cultural'}">Disco</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/music.css}">
</head>
<body>
    <div class="grain"></div>

    <header class="topbar">
        <a class="brand" th:href="${user != null ? '/profile' : '/'}" style="display:flex; align-items:center; gap:0.5rem;">
            <img th:src="@{/img/logo.png}" alt="TCD Logo" style="height: 24px;">
            <span th:text="${user != null ? '@' + user.username : 'The Cultured Dept.'}"></span>
        </a>
        <div class="topbar-actions" style="display:flex; align-items:center; gap:1rem;">
            <button class="ghost-btn" style="padding:0.4rem; min-height:unset; font-size:1rem;" data-mode-toggle aria-label="Cambiar modo">☀</button>
            <a class="ghost-link" href="/profile" th:if="${user != null}">Mi perfil</a>
            <form method="post" th:action="@{/logout}" th:if="${user != null}" style="margin:0;">
                <button type="submit" class="ghost-btn">Cerrar sesion</button>
            </form>
            <a class="ghost-link" href="/" th:if="${user == null}">Iniciar sesión</a>
            <a class="ghost-btn" href="/register" th:if="${user == null}">Regístrate</a>
        </div>
    </header>

    <main class="album-wrap">
        <section class="type-nav card compact-nav">
            <a th:href="@{/profile}">Mi perfil</a>
            <a th:href="@{/explore/pelicula}">Peliculas</a>
            <a th:href="@{/explore/serie}">Series</a>
            <a th:href="@{/explore/libro}">Libros</a>
            <a th:href="@{/explore/disco}" class="active">Discos</a>
        </section>

        <!-- Detalle del Disco -->
        <section class="card album-hero" th:if="${album != null}">
            <div class="media-cover" th:if="${album.coverUrl != null and !#strings.isEmpty(album.coverUrl)}">
                <img th:src="${album.coverUrl}" th:alt="${album.title}">
            </div>
            <div>
                <p class="kicker">Disco</p>
                <h1 th:text="${album.title}">Titulo</h1>
                <p class="muted" th:if="${album.releaseDate != null}">
                    Lanzamiento: <span th:text="${album.releaseDate.toString().length() >= 4 ? album.releaseDate.toString().substring(0,4) : album.releaseDate}">2024</span>
                </p>
                <p class="muted">
                    Artista: <a class="artist-link" th:href="@{/explore/disco(q=${album.artist})}" th:text="${album.artist}">Artista</a>
                </p>
                
                <form method="post" th:action="@{/profile/import-api}" class="add-form">
                    <input type="hidden" name="externalTitle" th:value="${album.title}">
                    <input type="hidden" name="externalType" value="disco">
                    <input type="hidden" name="externalCoverUrl" th:value="${album.coverUrl}">
                    <input type="hidden" name="externalReleaseDate" th:value="${album.releaseDate != null ? album.releaseDate.toString() : ''}">
                    <button type="submit">Añadir a mi perfil</button>
                </form>
            </div>
        </section>

        <!-- Lista de canciones mejorada -->
        <section class="card" th:if="${tracks != null and !#lists.isEmpty(tracks)}">
            <h2>Lista de canciones</h2>
            <div class="tracks-list">
                <div class="track-item" th:each="t : ${tracks}">
                    <div class="track-info">
                        <span class="track-num" th:text="${t.number}">1</span>
                        <span class="track-title" th:text="${t.title}">Titulo</span>
                    </div>
                    <span class="track-duration" th:text="${t.duration}">3:45</span>
                </div>
            </div>
        </section>

        <!-- Otros albunes del artista -->
        <section class="card" th:if="${relatedAlbums != null and !#lists.isEmpty(relatedAlbums)}">
            <h2 th:text="${'Mas de ' + album.artist}">Mas del artista</h2>
            <div class="actor-grid">
                <div class="actor-card" th:each="rel : ${relatedAlbums}">
                    <a th:href="@{/explore/disco/{id}(id=${rel.externalId})}">
                        <div class="media-cover mini-cover">
                            <img th:if="${rel.coverUrl != null and !#strings.isEmpty(rel.coverUrl)}" th:src="${rel.coverUrl}" th:alt="${rel.title}">
                            <div th:if="${rel.coverUrl == null or #strings.isEmpty(rel.coverUrl)}" class="media-cover placeholder"><span>?</span></div>
                        </div>
                        <p class="small-title" th:text="${rel.title}">Titulo</p>
                    </a>
                </div>
            </div>
        </section>

        <section class="card">
            <a href="/profile" class="artist-link">Volver al perfil</a>
        </section>
    </main>

    <script defer th:src="@{/js/theme.js}"></script>
</body>
</html>
